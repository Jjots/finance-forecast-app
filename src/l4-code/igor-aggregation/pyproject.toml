[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igor-aggregation"
version = "1.0.0"
description = "Finance Forecast System L4 dwh_query_comp Strategy prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["mypy==1.18.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "demo.py", "tests"]
